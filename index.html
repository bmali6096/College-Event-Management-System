<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CampusConnect | College Event Management</title>
<style>
:root{--navy:#14213d;--blue:#2563eb;--cyan:#38bdf8;--bg:#f5f7fb;--ink:#172033;--muted:#6b7280;--line:#e6eaf2;--white:#fff;--green:#0f9f6e;--amber:#d97706;--shadow:0 12px 34px rgba(23,32,51,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--navy);color:#fff;padding:25px 18px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;align-items:center;gap:11px;padding:0 8px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#38bdf8,#6366f1);display:grid;place-items:center;font-size:22px;font-weight:800}.brand h1{font-size:17px;line-height:1.1;margin:0}.brand small{display:block;color:#aab8d3;font-size:11px;margin-top:5px;font-weight:500}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#8494b5;padding:0 12px;margin-bottom:8px}.nav button{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:transparent;color:#c8d2e5;text-align:left;margin:4px 0;font-size:14px}.nav button.active,.nav button:hover{background:#243557;color:white}.nav .ico{width:22px;text-align:center;font-size:17px}.side-note{margin-top:auto;border:1px solid #354464;border-radius:14px;padding:15px;color:#c7d1e3;font-size:12px;line-height:1.6}.side-note strong{display:block;color:white;margin-bottom:5px}
.main{min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 36px;gap:18px}.search{display:flex;align-items:center;gap:9px;background:#f5f7fb;border:1px solid var(--line);border-radius:12px;padding:10px 13px;width:min(390px,48vw);color:var(--muted)}.search input{border:0;outline:0;background:transparent;width:100%;color:var(--ink)}.user{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}.avatar{width:37px;height:37px;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;border-radius:50%;font-weight:800}
.content{max-width:1440px;padding:32px 36px 46px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:25px}.eyebrow{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.6px;color:var(--blue);margin-bottom:8px}.page-head h2{font-size:29px;margin:0 0 8px;letter-spacing:-.8px}.page-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.btn{border-radius:11px;padding:11px 16px;font-weight:750;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s}.btn-primary{background:var(--blue);color:#fff;box-shadow:0 5px 13px #2563eb2b}.btn-primary:hover{background:#1d4ed8;transform:translateY(-1px)}.btn-light{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn-danger{background:#fff1f2;color:#be123c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:19px 20px;box-shadow:0 4px 15px #1d2a4405}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:37px;height:37px;display:grid;place-items:center;border-radius:11px;background:#eff6ff;font-size:18px}.stat-num{font-size:27px;font-weight:850;letter-spacing:-.7px;margin:12px 0 3px}.stat-foot{font-size:11px;color:var(--muted)}.stat-foot span{color:var(--green);font-weight:800}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:24px 0 15px}.section-head h3{font-size:17px;margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{padding:8px 13px;background:#fff;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:12px;font-weight:700}.filter.active{background:#eaf2ff;color:#1d4ed8;border-color:#c8dcff}
.events{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.event-card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:0 5px 17px #1d2a4405;transition:.18s;display:flex;flex-direction:column}.event-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.event-art{height:145px;padding:17px;position:relative;display:flex;align-items:flex-end;color:#fff;overflow:hidden}.event-art:before,.event-art:after{content:"";position:absolute;border-radius:50%;background:#ffffff18}.event-art:before{width:180px;height:180px;right:-20px;top:-75px}.event-art:after{width:105px;height:105px;right:65px;top:45px}.art-tech{background:linear-gradient(135deg,#4f46e5,#0ea5e9)}.art-culture{background:linear-gradient(135deg,#be185d,#f97316)}.art-sports{background:linear-gradient(135deg,#047857,#84cc16)}.art-career{background:linear-gradient(135deg,#334155,#64748b)}.art-workshop{background:linear-gradient(135deg,#7c3aed,#c084fc)}.art-default{background:linear-gradient(135deg,#0369a1,#22d3ee)}.event-emoji{font-size:36px;position:absolute;right:23px;top:23px;z-index:1}.event-type{font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:1.5px;position:relative;z-index:1}.event-body{padding:17px 17px 15px;display:flex;flex-direction:column;flex:1}.event-body h4{margin:0 0 9px;font-size:16px;letter-spacing:-.2px}.event-desc{font-size:12px;color:var(--muted);line-height:1.55;min-height:37px;margin-bottom:14px}.event-meta{display:flex;flex-direction:column;gap:8px;font-size:12px;color:#525d70;margin-bottom:16px}.event-meta span{display:flex;align-items:center;gap:8px}.event-bottom{border-top:1px solid #eef1f6;padding-top:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}.seat{font-size:11px;color:var(--muted)}.seat strong{color:var(--ink)}.event-bottom .btn{padding:9px 12px;font-size:12px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 15px #1d2a4404}.empty{padding:48px 18px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #cbd5e1;border-radius:16px}.empty strong{display:block;color:var(--ink);font-size:16px;margin:8px 0}
.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{text-align:left;padding:14px 17px;border-bottom:1px solid #edf0f5;font-size:12px}.table th{background:#f9fafc;color:#697386;text-transform:uppercase;letter-spacing:.7px;font-size:10px}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:#dcfce7;color:#166534;font-size:10px;font-weight:800}.pill.closed{background:#fef3c7;color:#92400e}.pill.cancelled{background:#ffe4e6;color:#9f1239}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:#394357}.field input,.field select,.field textarea{width:100%;border:1px solid #dce2eb;border-radius:10px;padding:11px 12px;background:#fff;outline:0;color:var(--ink);font-size:13px}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7aa7ff;box-shadow:0 0 0 3px #2563eb14}.field textarea{resize:vertical;min-height:85px}.form-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;right:24px;bottom:24px;background:#13213b;color:white;border-radius:12px;padding:14px 18px;box-shadow:var(--shadow);font-size:13px;z-index:10;animation:up .2s ease}.toast.error{background:#9f1239}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal-backdrop{position:fixed;inset:0;background:#0f172a80;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:19px;padding:25px;box-shadow:0 30px 100px #0003}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:20px}.modal-head h3{margin:0 0 6px;font-size:21px}.modal-head p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.xbtn{width:32px;height:32px;border-radius:9px;background:#f1f5f9;color:#475569;font-size:20px}
.notice{border:1px solid #bfdbfe;background:#eff6ff;border-radius:12px;padding:13px 15px;color:#1e40af;font-size:12px;line-height:1.6;margin-top:18px}.footnote{text-align:center;color:#9aa3b2;font-size:11px;margin-top:28px}
@media(max-width:1100px){.app{grid-template-columns:210px 1fr}.events{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:27px 24px}.topbar{padding:0 24px}}
@media(max-width:760px){.app{display:block}.sidebar{padding:13px 15px;gap:14px}.brand{padding:0}.sidebar .nav-label,.side-note{display:none}.nav{display:flex;gap:5px;overflow:auto}.nav button{width:auto;white-space:nowrap;margin:0;padding:10px 12px}.nav .ico{display:none}.topbar{height:64px;padding:0 16px}.search{width:100%}.user .username{display:none}.content{padding:23px 15px}.page-head{flex-direction:column}.page-head h2{font-size:25px}.events{grid-template-columns:1fr}.stats{gap:10px}.stat{padding:14px}.stat-num{font-size:24px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.section-head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="logo">C</div><div><h1>CampusConnect<small>EVENT MANAGEMENT</small></h1></div></div>
    <div><div class="nav-label">Workspace</div><nav class="nav" id="nav">
      <button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button>
      <button data-page="events"><span class="ico">◷</span>Browse Events</button>
      <button data-page="registrations"><span class="ico">✓</span>My Registrations</button>
      <button data-page="admin"><span class="ico">⚙</span>Admin Panel</button>
    </nav></div>
    <div class="side-note"><strong>🎓 Student project demo</strong>This is a browser-ready prototype. Your demo data is saved in this browser on this device.</div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="search">⌕ <input id="searchInput" type="search" placeholder="Search events, venues, categories..." aria-label="Search events"></div>
      <div class="user"><div class="avatar">ST</div><span class="username">Student Demo</span><span style="color:#9ca3af">▾</span></div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
  <div class="modal"><div class="modal-head"><div><h3 id="modalTitle">Register for event</h3><p id="modalSubtitle">Enter your details to reserve a place.</p></div><button class="xbtn" id="closeModal" aria-label="Close">×</button></div><div id="modalContent"></div></div>
</div>
<script>
const seedEvents=[
 {id:1,title:"CodeSprint 2026",category:"Technology",emoji:"💻",art:"tech",date:"2026-11-15",time:"10:00",venue:"Computer Lab 2",capacity:80,description:"A friendly coding challenge for students to solve problems, collaborate and build confidence.",status:"Published"},
 {id:2,title:"Cultural Fest",category:"Cultural",emoji:"🎭",art:"culture",date:"2026-11-22",time:"11:00",venue:"College Auditorium",capacity:250,description:"Celebrate creativity, music, dance and the diversity of our campus community.",status:"Published"},
 {id:3,title:"Inter-Department Sports Meet",category:"Sports",emoji:"🏆",art:"sports",date:"2026-11-30",time:"09:00",venue:"College Sports Ground",capacity:180,description:"Join your classmates for a day of teamwork, fitness and friendly competition.",status:"Published"},
 {id:4,title:"Career Readiness Seminar",category:"Career",emoji:"🎯",art:"career",date:"2026-12-05",time:"12:00",venue:"Seminar Hall",capacity:100,description:"Explore interview preparation, communication skills and early career planning.",status:"Published"},
 {id:5,title:"Web Development Workshop",category:"Workshop",emoji:"🧩",art:"workshop",date:"2026-12-12",time:"10:30",venue:"Innovation Lab",capacity:45,description:"Learn the basics of building responsive web pages in a guided hands-on session.",status:"Published"}
];
const KEY_EVENTS="cems_demo_events_v1", KEY_REGS="cems_demo_regs_v1";
let events=read(KEY_EVENTS,seedEvents), registrations=read(KEY_REGS,[]);
let currentPage="dashboard", activeFilter="All", searchTerm="";
function read(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):structuredClone(fallback)}catch(e){return JSON.parse(JSON.stringify(fallback))}}
function save(){localStorage.setItem(KEY_EVENTS,JSON.stringify(events));localStorage.setItem(KEY_REGS,JSON.stringify(registrations))}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function dateLabel(s){if(!s)return "Date TBC";return new Date(s+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
function timeLabel(s){if(!s)return "Time TBC";const [h,m]=s.split(":").map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})}
function categoryArt(e){return ["tech","culture","sports","career","workshop"].includes(e.art)?e.art:"default"}
function getRegsFor(id){return registrations.filter(r=>r.eventId===id)}
function available(e){return Math.max(0,Number(e.capacity||0)-getRegsFor(e.id).length)}
function upcoming(){return events.filter(e=>e.status==="Published" && e.date>=new Date().toISOString().slice(0,10))}
function filteredEvents(){return upcoming().filter(e=>(activeFilter==="All"||e.category===activeFilter)&&(!searchTerm||[e.title,e.category,e.venue,e.description].join(" ").toLowerCase().includes(searchTerm.toLowerCase())))}
function toast(message,error=false){const old=document.querySelector(".toast");if(old)old.remove();const el=document.createElement("div");el.className="toast"+(error?" error":"");el.textContent=message;document.body.appendChild(el);setTimeout(()=>el.remove(),2800)}
function setPage(page){currentPage=page;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
function eventCard(e){const n=getRegsFor(e.id).length;const closed=e.status!=="Published"||available(e)<=0;return `<article class="event-card"><div class="event-art art-${categoryArt(e)}"><span class="event-emoji">${escapeHtml(e.emoji||"🎓")}</span><span class="event-type">${escapeHtml(e.category)}</span></div><div class="event-body"><h4>${escapeHtml(e.title)}</h4><div class="event-desc">${escapeHtml(e.description)}</div><div class="event-meta"><span>▦ &nbsp;${dateLabel(e.date)} · ${timeLabel(e.time)}</span><span>⌖ &nbsp;${escapeHtml(e.venue)}</span><span>♙ &nbsp;${n} registered</span></div><div class="event-bottom"><span class="seat"><strong>${available(e)}</strong> seats left</span><button class="btn ${closed?'btn-light':'btn-primary'}" ${closed?'disabled':''} onclick="openRegister(${e.id})">${closed?'Full / Closed':'Register →'}</button></div></div></article>`}
function pageHead(eyebrow,title,desc,button=""){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><p>${desc}</p></div>${button}</div>`}
function render(){
const root=document.getElementById("content");
if(currentPage==="dashboard"){
const up=upcoming();root.innerHTML=pageHead("YOUR CAMPUS, CONNECTED","Good day, Student 👋","Discover activities, reserve your spot and stay involved in campus life.",`<button class="btn btn-primary" onclick="setPage('events')">＋ Explore events</button>`)+
`<div class="stats"><div class="stat"><div class="stat-top">Upcoming Events <span class="stat-icon">📅</span></div><div class="stat-num">${up.length}</div><div class="stat-foot"><span>●</span> Published on the portal</div></div><div class="stat"><div class="stat-top">My Registrations <span class="stat-icon">✓</span></div><div class="stat-num">${registrations.length}</div><div class="stat-foot">Your saved event bookings</div></div><div class="stat"><div class="stat-top">Available Seats <span class="stat-icon">♙</span></div><div class="stat-num">${up.reduce((a,e)=>a+available(e),0)}</div><div class="stat-foot">Across upcoming events</div></div><div class="stat"><div class="stat-top">Event Categories <span class="stat-icon">✦</span></div><div class="stat-num">${new Set(up.map(e=>e.category)).size}</div><div class="stat-foot">Explore your interests</div></div></div>
<div class="section-head"><h3>Featured & upcoming events</h3><button class="btn btn-light" onclick="setPage('events')">View all events →</button></div><div class="events">${up.slice(0,3).map(eventCard).join("")}</div><div class="notice"><strong>Project demo:</strong> registrations and events are saved only in this browser. This prototype does not connect to a real college server or MySQL database.</div>`;
}else if(currentPage==="events"){
const cats=["All",...new Set(upcoming().map(e=>e.category))];root.innerHTML=pageHead("DISCOVER","Browse Events","Find an activity, read the details and register online.")+`<div class="section-head"><h3>${filteredEvents().length} event${filteredEvents().length===1?"":"s"} available</h3><div class="filters">${cats.map(c=>`<button class="filter ${activeFilter===c?'active':''}" onclick="activeFilter='${escapeHtml(c)}';render()">${escapeHtml(c)}</button>`).join("")}</div></div><div class="events">${filteredEvents().map(eventCard).join("")||`<div class="empty" style="grid-column:1/-1">🔎<strong>No events found</strong>Try another search or category.</div>`}`;
}else if(currentPage==="registrations"){
root.innerHTML=pageHead("YOUR ACTIVITY","My Registrations","Review events you have registered for in this browser.")+(registrations.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Event</th><th>Date & time</th><th>Venue</th><th>Registered as</th><th>Action</th></tr></thead><tbody>${registrations.map(r=>{const e=events.find(e=>e.id===r.eventId);return e?`<tr><td><strong>${escapeHtml(e.title)}</strong><div style="color:#8790a0;margin-top:4px">${escapeHtml(e.category)}</div></td><td>${dateLabel(e.date)}<div style="color:#8790a0;margin-top:4px">${timeLabel(e.time)}</div></td><td>${escapeHtml(e.venue)}</td><td>${escapeHtml(r.name)}<div style="color:#8790a0;margin-top:4px">${escapeHtml(r.email)}</div></td><td><button class="btn btn-danger" onclick="cancelReg(${r.id})">Cancel</button></td></tr>`:""}).join("")}</tbody></table></div>`:`<div class="empty">🗓️<strong>No registrations yet</strong>Browse events and register for your first activity.<br><br><button class="btn btn-primary" onclick="setPage('events')">Browse events</button></div>`);
}else if(currentPage==="admin"){
root.innerHTML=pageHead("ORGANIZER TOOLS","Admin Panel","Create events and review the demo registration list.",`<button class="btn btn-primary" onclick="openAddEvent()">＋ Add new event</button>`)+`<div class="panel" style="margin-bottom:18px"><div class="section-head" style="margin-top:0"><h3>Event inventory</h3><span style="font-size:12px;color:var(--muted)">${events.length} total events</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Event</th><th>Date</th><th>Venue</th><th>Registrations</th><th>Status</th><th>Action</th></tr></thead><tbody>${events.map(e=>`<tr><td><strong>${escapeHtml(e.title)}</strong><div style="color:#8790a0;margin-top:4px">${escapeHtml(e.category)}</div></td><td>${dateLabel(e.date)}</td><td>${escapeHtml(e.venue)}</td><td>${getRegsFor(e.id).length} / ${Number(e.capacity)}</td><td><span class="pill ${e.status!=="Published"?(e.status==="Cancelled"?"cancelled":"closed"):""}">${escapeHtml(e.status)}</span></td><td><button class="btn btn-light" onclick="toggleStatus(${e.id})">${e.status==="Published"?"Close":"Publish"}</button> <button class="btn btn-danger" onclick="deleteEvent(${e.id})">Delete</button></td></tr>`).join("")}</tbody></table></div></div><div class="panel"><div class="section-head" style="margin-top:0"><h3>Registration records</h3><button class="btn btn-light" onclick="exportCSV()">↓ Export CSV</button></div>${registrations.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Student</th><th>Email</th><th>Event</th><th>Registered</th></tr></thead><tbody>${registrations.map(r=>{let e=events.find(e=>e.id===r.eventId);return `<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.email)}</td><td>${escapeHtml(e?.title||"Event removed")}</td><td>${new Date(r.createdAt).toLocaleDateString("en-IN")}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty">No registrations have been submitted in this demo yet.</div>`}</div><div class="notice"><strong>Demo note:</strong> This admin panel has no real authentication. Use dummy information only. For production, add a secure backend, admin login and server-side permissions.</div>`;
}
}
function openModal(title,subtitle,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalSubtitle").textContent=subtitle;document.getElementById("modalContent").innerHTML=body;document.getElementById("modalBackdrop").classList.add("show")}
function closeModal(){document.getElementById("modalBackdrop").classList.remove("show")}
function openRegister(id){const e=events.find(x=>x.id===id);if(!e)return;if(available(e)<=0){toast("Sorry, this event is full.",true);return}openModal("Register for "+e.title,"Enter your details to reserve a place.",`<form id="registerForm"><div class="form-grid"><div class="field full"><label for="studentName">Full name *</label><input id="studentName" required maxlength="100" placeholder="e.g. Aditi Patil"></div><div class="field full"><label for="studentEmail">Email address *</label><input id="studentEmail" type="email" required maxlength="150" placeholder="you@example.com"></div></div><div class="notice">By registering, you confirm that the details entered are correct. This demo stores details locally in your browser.</div><div class="form-actions"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Confirm registration</button></div></form>`);
document.getElementById("registerForm").addEventListener("submit",ev=>{ev.preventDefault();const name=document.getElementById("studentName").value.trim(),email=document.getElementById("studentEmail").value.trim().toLowerCase();if(!name||!email){toast("Please fill in all required fields.",true);return}if(registrations.some(r=>r.eventId===id&&r.email.toLowerCase()===email)){toast("This email is already registered for this event.",true);return}if(available(e)<=0){toast("This event has just become full.",true);closeModal();render();return}registrations.push({id:Date.now(),eventId:id,name,email,createdAt:new Date().toISOString()});save();closeModal();render();toast("Registration successful! See My Registrations.");});
}
function openAddEvent(){openModal("Add a new event","Complete the event details and publish it to the demo portal.",`<form id="eventForm"><div class="form-grid"><div class="field full"><label for="eventTitle">Event title *</label><input id="eventTitle" required maxlength="150" placeholder="e.g. AI & Data Science Workshop"></div><div class="field"><label for="eventCategory">Category *</label><select id="eventCategory"><option>Technology</option><option>Cultural</option><option>Sports</option><option>Career</option><option>Workshop</option><option>Seminar</option><option>Other</option></select></div><div class="field"><label for="eventDate">Date *</label><input id="eventDate" type="date" required></div><div class="field"><label for="eventTime">Start time</label><input id="eventTime" type="time" value="10:00"></div><div class="field"><label for="eventCapacity">Capacity *</label><input id="eventCapacity" type="number" min="1" max="10000" value="60" required></div><div class="field full"><label for="eventVenue">Venue *</label><input id="eventVenue" required maxlength="150" placeholder="e.g. Seminar Hall"></div><div class="field full"><label for="eventDesc">Description</label><textarea id="eventDesc" maxlength="600" placeholder="What will students learn or do?"></textarea></div></div><div class="form-actions"><button type="button" class="btn btn-light" onclick="closeModal()">Cancel</button><button class="btn btn-primary" type="submit">Save event</button></div></form>`);
document.getElementById("eventDate").min=new Date().toISOString().slice(0,10);
document.getElementById("eventForm").addEventListener("submit",ev=>{ev.preventDefault();const title=document.getElementById("eventTitle").value.trim(),category=document.getElementById("eventCategory").value,date=document.getElementById("eventDate").value,time=document.getElementById("eventTime").value,venue=document.getElementById("eventVenue").value.trim(),capacity=Number(document.getElementById("eventCapacity").value),description=document.getElementById("eventDesc").value.trim();if(!title||!date||!venue||capacity<1){toast("Please complete the required fields.",true);return}const emojiMap={Technology:"💻",Cultural:"🎭",Sports:"🏆",Career:"🎯",Workshop:"🧩",Seminar:"🎤",Other:"🎓"};const artMap={Technology:"tech",Cultural:"culture",Sports:"sports",Career:"career",Workshop:"workshop",Seminar:"default",Other:"default"};events.push({id:Date.now(),title,category,emoji:emojiMap[category],art:artMap[category],date,time,venue,capacity,description:description||"More information will be announced by the event organizer.",status:"Published"});save();closeModal();render();toast("Event added successfully.");});
}
function cancelReg(id){if(!confirm("Cancel this demo registration?"))return;registrations=registrations.filter(r=>r.id!==id);save();render();toast("Registration cancelled.");}
function toggleStatus(id){const e=events.find(e=>e.id===id);if(!e)return;e.status=e.status==="Published"?"Closed":"Published";save();render();toast(`Event status changed to ${e.status}.`)}
function deleteEvent(id){if(!confirm("Delete this event and its demo registrations?"))return;events=events.filter(e=>e.id!==id);registrations=registrations.filter(r=>r.eventId!==id);save();render();toast("Event deleted.");}
function exportCSV(){const rows=[["Student name","Email","Event","Registration date"],...registrations.map(r=>[r.name,r.email,events.find(e=>e.id===r.eventId)?.title||"Event removed",r.createdAt])];const csv=rows.map(row=>row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="cems-registrations.csv";a.click();URL.revokeObjectURL(url);toast("CSV export downloaded.");}
document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
document.getElementById("searchInput").addEventListener("input",e=>{searchTerm=e.target.value;if(currentPage!=="events"){setPage("events")}else render()});
document.getElementById("closeModal").addEventListener("click",closeModal);
document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
render();
</script>
